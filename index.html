else if(t.id==='ei'&&m){const c=isianCap(m),v=Math.max(0,Math.min(20,+t.value||0));m.isian=Math.min(v,c);if(v>c)toast(c?'Kertas ini hanya muat '+c+' soal isian':'Tidak ada ruang isian di kertas ini, pakai F4 atau kurangi soal PG');save();rMapel()}
else if((t.id==='e2'||t.id==='e3')&&m){m[t.id==='e2'?'dua':'tiga']=Math.max(0,+t.value||0);norm(m);m.isian=Math.min(m.isian||0,isianCap(m));save();rMapel();if(over(m))toast('Isi lembar melebihi tinggi kertas, pakai F4')}
else if(t.id==='ep'&&m){m.parsial=+t.value;save()}
else if(t.id==='t2'&&m){const v=t.value;if(v==='isian'){m._d2=m.dua||m._d2;m.dua=0;norm(m);m.isian=Math.min(m._di||5,isianCap(m))}else{m._di=m.isian||m._di;m.isian=0;m.dua=m._d2||5;norm(m)}m.tipe2=v;save();rMapel();if(over(m))toast('Isi lembar melebihi tinggi kertas, pakai F4')}
else if(t.id==='ek'&&m){m.kertas=t.value;m.isian=Math.min(m.isian||0,isianCap(m));save();rMapel()}
else if(t.id==='fc'||t.id==='fu'){loadImg(t.files[0]);t.value=''}
else if(t.id==='tpf'){tplRead(t.files[0]);t.value=''}
else if(t.id==='dpf'){dpRead(t.files[0]);t.value=''}
else if(t.id==='lgf'){loadLogo(t.dataset.k,t.files[0]);t.value=''}
else if(t.id==='skel'){D.kelasAktif=t.value;save();fillSS();if(S?.res)showRes()}
else if(t.id==='ss'&&S)S.manual=1;
else if(t.dataset.sno){const s=D.siswa.find(x=>x.id===t.dataset.sno),v=Math.round(+t.value);if(s){if(!(v>=1&&v<=99))toast('No. absen harus 1–99');else if(D.siswa.some(x=>x!==s&&(x.kelas||'')===(s.kelas||'')&&+x.no===v))toast('No. absen '+v+' sudah dipakai');else{s.no=v;save()}}rSek()}});
document.addEventListener('toggle',e=>{const k=e.target.dataset?.sec;if(k)sec[k]=e.target.open?1:0},true);
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f){D.school[f]=e.target.value;save()}});
go(location.hash.slice(1));
</script></body></html>
